PLG_FIELDS_YOUTUBE = "Fields - Youtube"
PLG_FIELDS_YOUTUBE_XML_DESCRIPTION = "This plugin lets you create new fields for 'Youtube videos' in any extensions where custom fields are supported."
PLG_FIELDS_YOUTUBE_LABEL = "Youtube (%s)"
PLG_FIELDS_YOUTUBE_PRO_ONLY = "Only available in the PRO version"

PLG_FIELDS_YOUTUBE_PARAMS_VIDEO_WIDTH_LABEL = "Width"
PLG_FIELDS_YOUTUBE_PARAMS_VIDEO_WIDTH_DESC = "This parameter specifies the video width, you can use % or px"
PLG_FIELDS_YOUTUBE_PARAMS_VIDEO_HEIGHT_LABEL = "Height"
PLG_FIELDS_YOUTUBE_PARAMS_VIDEO_HEIGHT_DESC = "This parameter specifies the video height, you can use % or px"
PLG_FIELDS_YOUTUBE_PARAMS_AUTOPLAY_LABEL = "Autoplay"
PLG_FIELDS_YOUTUBE_PARAMS_AUTOPLAY_DESC = "This parameter specifies whether the initial video will automatically start to play when the player loads."
PLG_FIELDS_YOUTUBE_PARAMS_CONTROLS_LABEL = "Show Controls"
PLG_FIELDS_YOUTUBE_PARAMS_CONTROLS_DESC = "This parameter indicates whether the video player controls are displayed."
PLG_FIELDS_YOUTUBE_PARAMS_COLOR_LABEL = "Color"
PLG_FIELDS_YOUTUBE_PARAMS_COLOR_DESC = "This parameter specifies the color that will be used in the player's video progress bar to highlight the amount of the video that the viewer has already seen."
PLG_FIELDS_YOUTUBE_PARAMS_COLOR_WHITE = "White"
PLG_FIELDS_YOUTUBE_PARAMS_COLOR_RED = "Red"
PLG_FIELDS_YOUTUBE_PARAMS_MODESTBRANDING_LABEL = "Modestbranding"
PLG_FIELDS_YOUTUBE_PARAMS_MODESTBRANDING_DESC = "This parameter lets you use a YouTube player that does not show a YouTube logo. Set the parameter value to YES to prevent the YouTube logo from displaying in the control bar. Note that a small YouTube text label will still display in the upper-right corner of a paused video when the user's mouse pointer hovers over the player."
PLG_FIELDS_YOUTUBE_PARAMS_FULLSCREEN_LABEL = "Allow Fullscreen"
PLG_FIELDS_YOUTUBE_PARAMS_FULLSCREEN_DESC = "Setting this parameter to NO prevents the fullscreen button from displaying in the player."
PLG_FIELDS_YOUTUBE_PARAMS_REL_LABEL = "Show Related Videos"
PLG_FIELDS_YOUTUBE_PARAMS_REL_DESC = "This parameter indicates whether the player should show related videos when playback of the initial video ends."

;since version 1.1.0
PLG_FIELDS_YOUTUBE_PARAMS_ALIGN_LABEL = "Align"
PLG_FIELDS_YOUTUBE_PARAMS_ALIGN_DESC = "This parameter specifies how you want to align the presentation. Choose between Left or Center"
PLG_FIELDS_YOUTUBE_PARAMS_ALIGN_LEFT = "Left"
PLG_FIELDS_YOUTUBE_PARAMS_ALIGN_CENTER = "Center"
PLG_FIELDS_YOUTUBE_PARAMS_ALIGN_RIGHT = "Right"
PLG_FIELDS_YOUTUBE_PARAMS_MODE_LABEL = "Mode"
PLG_FIELDS_YOUTUBE_PARAMS_MODE_DESC = "Choose the mode of the player. Classic mode will let you setup width, height and alignment. Responsive mode will always be 100% width and let you choose the aspect ratio"
PLG_FIELDS_YOUTUBE_PARAMS_MODE_CLASSIC = "Classic mode"
PLG_FIELDS_YOUTUBE_PARAMS_MODE_RESPONSIVE = "Responsive mode"
PLG_FIELDS_YOUTUBE_PARAMS_ASPECTRATIO_LABEL = "Aspect Ratio"
PLG_FIELDS_YOUTUBE_PARAMS_ASPECTRATIO_DESC = "Choose the Aspect Ratio. You can choose between 16:9 and 4:3"

;since version 5.2.0
PLG_FIELDS_YOUTUBE_PLAY = "Play video"
PLG_FIELDS_YOUTUBE_PARAMS_NOCOOKIE_LABEL = "Privacy-Enhanced Mode (no cookies)"
PLG_FIELDS_YOUTUBE_PARAMS_NOCOOKIE_DESC = "When enabled the video is embedded via youtube-nocookie.com so YouTube does not store cookies or tracking information until the visitor plays the video. Recommended for GDPR compliance."
PLG_FIELDS_YOUTUBE_PARAMS_LITE_LABEL = "Click to Play (lazy load)"
PLG_FIELDS_YOUTUBE_PARAMS_LITE_DESC = "When enabled only a thumbnail with a play button is shown. The YouTube player is loaded, and YouTube is contacted, only after the visitor clicks. Best for privacy and page speed."
PLG_FIELDS_YOUTUBE_PARAMS_MUTE_LABEL = "Mute"
PLG_FIELDS_YOUTUBE_PARAMS_MUTE_DESC = "When enabled the video starts muted. Most browsers require this for autoplay to work."
PLG_FIELDS_YOUTUBE_PARAMS_CAPTIONS_LABEL = "Show Captions"
PLG_FIELDS_YOUTUBE_PARAMS_CAPTIONS_DESC = "When enabled closed captions are shown by default, even if the viewer has turned captions off."
PLG_FIELDS_YOUTUBE_PARAMS_PLAYSINLINE_LABEL = "Play Inline (mobile)"
PLG_FIELDS_YOUTUBE_PARAMS_PLAYSINLINE_DESC = "When enabled the video plays inline on iPhone instead of automatically going fullscreen."
PLG_FIELDS_YOUTUBE_PARAMS_LOOP_LABEL = "Loop"
PLG_FIELDS_YOUTUBE_PARAMS_LOOP_DESC = "When enabled the video plays again from the start once it ends."
PLG_FIELDS_YOUTUBE_PARAMS_START_LABEL = "Start Time (seconds)"
PLG_FIELDS_YOUTUBE_PARAMS_START_DESC = "Start playback at this number of seconds from the beginning of the video. Leave empty to start at the beginning. A start time in the video URL (e.g. ?t=90) overrides this option per video."
PLG_FIELDS_YOUTUBE_PARAMS_END_LABEL = "End Time (seconds)"
PLG_FIELDS_YOUTUBE_PARAMS_END_DESC = "Stop playback at this number of seconds from the beginning of the video. Leave empty to play until the end. An end time in the video URL (e.g. &end=120) overrides this option per video."

PLG_FIELDS_YOUTUBE_FREE_VERSION = "This is the FREE version of Joomill Custom Fields plugin. <br/> Some features and support are only available in the PRO Version."
PLG_FIELDS_YOUTUBE_UPGRADE_DESC = "<div class=\"alert alert-success\">You are using the FREE version of the Joomill Custom Fields plugin. Some features and support are only available in the <a href=\"https://www.joomill-extensions.com/extensions/custom-fields-plugins\" target=\"_blank\" rel=\"noopener\">PRO version</a>.</div>"

PLG_FIELDS_YOUTUBE = "Campi - Youtube"
PLG_FIELDS_YOUTUBE_XML_DESCRIPTION = "Questo plugin ti permette di creare nuovi campi per 'video di Youtube' in qualsiasi estensione dove sono supportati i campi personalizzati."
PLG_FIELDS_YOUTUBE_LABEL = "Youtube (%s)"
PLG_FIELDS_YOUTUBE_PRO_ONLY = "Disponibile solo nella versione PRO"

PLG_FIELDS_YOUTUBE_PARAMS_VIDEO_WIDTH_LABEL = "Larghezza"
PLG_FIELDS_YOUTUBE_PARAMS_VIDEO_WIDTH_DESC = "Questo parametro specifica la larghezza del video, puoi usare % o px"
PLG_FIELDS_YOUTUBE_PARAMS_VIDEO_HEIGHT_LABEL = "Altezza"
PLG_FIELDS_YOUTUBE_PARAMS_VIDEO_HEIGHT_DESC = "Questo parametro specifica l'altezza del video, puoi usare % o px"
PLG_FIELDS_YOUTUBE_PARAMS_AUTOPLAY_LABEL = "Riproduzione automatica"
PLG_FIELDS_YOUTUBE_PARAMS_AUTOPLAY_DESC = "Questo parametro specifica se il video iniziale inizierà automaticamente a riprodursi quando il lettore viene caricato."
PLG_FIELDS_YOUTUBE_PARAMS_CONTROLS_LABEL = "Mostra controlli"
PLG_FIELDS_YOUTUBE_PARAMS_CONTROLS_DESC = "Questo parametro indica se i controlli del lettore video sono visualizzati."
PLG_FIELDS_YOUTUBE_PARAMS_COLOR_LABEL = "Colore"
PLG_FIELDS_YOUTUBE_PARAMS_COLOR_DESC = "Questo parametro specifica il colore che verrà utilizzato nella barra di avanzamento del video del lettore per evidenziare la quantità di video che lo spettatore ha già visto."
PLG_FIELDS_YOUTUBE_PARAMS_COLOR_WHITE = "Bianco"
PLG_FIELDS_YOUTUBE_PARAMS_COLOR_RED = "Rosso"
PLG_FIELDS_YOUTUBE_PARAMS_MODESTBRANDING_LABEL = "Branding modesto"
PLG_FIELDS_YOUTUBE_PARAMS_MODESTBRANDING_DESC = "Questo parametro ti permette di utilizzare un lettore YouTube che non mostra un logo YouTube. Imposta il valore del parametro su SÌ per impedire che il logo YouTube venga visualizzato nella barra di controllo. Nota che una piccola etichetta di testo YouTube verrà comunque visualizzata nell'angolo in alto a destra di un video in pausa quando il puntatore del mouse dell'utente passa sopra il lettore."
PLG_FIELDS_YOUTUBE_PARAMS_FULLSCREEN_LABEL = "Consenti schermo intero"
PLG_FIELDS_YOUTUBE_PARAMS_FULLSCREEN_DESC = "Impostando questo parametro su NO si impedisce che il pulsante dello schermo intero venga visualizzato nel lettore."
PLG_FIELDS_YOUTUBE_PARAMS_REL_LABEL = "Mostra video correlati"
PLG_FIELDS_YOUTUBE_PARAMS_REL_DESC = "Questo parametro indica se il lettore dovrebbe mostrare video correlati quando la riproduzione del video iniziale termina."

;since version 1.1.0
PLG_FIELDS_YOUTUBE_PARAMS_ALIGN_LABEL = "Allinea"
PLG_FIELDS_YOUTUBE_PARAMS_ALIGN_DESC = "Questo parametro specifica come vuoi allineare la presentazione. Scegli tra Sinistra o Centro"
PLG_FIELDS_YOUTUBE_PARAMS_ALIGN_LEFT = "Sinistra"
PLG_FIELDS_YOUTUBE_PARAMS_ALIGN_CENTER = "Centro"
PLG_FIELDS_YOUTUBE_PARAMS_ALIGN_RIGHT = "Destra"
PLG_FIELDS_YOUTUBE_PARAMS_MODE_LABEL = "Modalità"
PLG_FIELDS_YOUTUBE_PARAMS_MODE_DESC = "Scegli la modalità del lettore. La modalità classica ti permetterà di impostare larghezza, altezza e allineamento. La modalità reattiva sarà sempre al 100% di larghezza e ti permetterà di scegliere il rapporto d'aspetto"
PLG_FIELDS_YOUTUBE_PARAMS_MODE_CLASSIC = "Modalità classica"
PLG_FIELDS_YOUTUBE_PARAMS_MODE_RESPONSIVE = "Modalità reattiva"
PLG_FIELDS_YOUTUBE_PARAMS_ASPECTRATIO_LABEL = "Rapporto d'aspetto"
PLG_FIELDS_YOUTUBE_PARAMS_ASPECTRATIO_DESC = "Scegli il rapporto d'aspetto. Puoi scegliere tra 16:9 e 4:3"

;dalla versione 5.2.0
PLG_FIELDS_YOUTUBE_PLAY = "Riproduci video"
PLG_FIELDS_YOUTUBE_PARAMS_NOCOOKIE_LABEL = "Modalità privacy avanzata (senza cookie)"
PLG_FIELDS_YOUTUBE_PARAMS_NOCOOKIE_DESC = "Quando abilitato, il video viene incorporato tramite youtube-nocookie.com in modo che YouTube non memorizzi cookie o informazioni di tracciamento finché il visitatore non riproduce il video. Consigliato per la conformità al GDPR."
PLG_FIELDS_YOUTUBE_PARAMS_LITE_LABEL = "Clicca per riprodurre (caricamento differito)"
PLG_FIELDS_YOUTUBE_PARAMS_LITE_DESC = "Quando abilitato, viene mostrata solo una miniatura con un pulsante di riproduzione. Il lettore YouTube viene caricato, e YouTube viene contattato, solo dopo che il visitatore fa clic. Scelta migliore per privacy e velocità della pagina."
PLG_FIELDS_YOUTUBE_PARAMS_MUTE_LABEL = "Disattiva audio"
PLG_FIELDS_YOUTUBE_PARAMS_MUTE_DESC = "Quando abilitato, il video si avvia con l'audio disattivato. La maggior parte dei browser lo richiede affinché la riproduzione automatica funzioni."
PLG_FIELDS_YOUTUBE_PARAMS_CAPTIONS_LABEL = "Mostra sottotitoli"
PLG_FIELDS_YOUTUBE_PARAMS_CAPTIONS_DESC = "Quando abilitato, i sottotitoli vengono mostrati per impostazione predefinita, anche se lo spettatore li ha disattivati."
PLG_FIELDS_YOUTUBE_PARAMS_PLAYSINLINE_LABEL = "Riproduci in linea (mobile)"
PLG_FIELDS_YOUTUBE_PARAMS_PLAYSINLINE_DESC = "Quando abilitato, il video viene riprodotto in linea su iPhone invece di passare automaticamente a schermo intero."
PLG_FIELDS_YOUTUBE_PARAMS_LOOP_LABEL = "Ripeti"
PLG_FIELDS_YOUTUBE_PARAMS_LOOP_DESC = "Quando abilitato, il video viene riprodotto di nuovo dall'inizio una volta terminato."
PLG_FIELDS_YOUTUBE_PARAMS_START_LABEL = "Tempo di inizio (secondi)"
PLG_FIELDS_YOUTUBE_PARAMS_START_DESC = "Avvia la riproduzione a questo numero di secondi dall'inizio del video. Lascia vuoto per iniziare dall'inizio. Un tempo di inizio nell'URL del video (es. ?t=90) sostituisce questa opzione per ogni video."
PLG_FIELDS_YOUTUBE_PARAMS_END_LABEL = "Tempo di fine (secondi)"
PLG_FIELDS_YOUTUBE_PARAMS_END_DESC = "Interrompe la riproduzione a questo numero di secondi dall'inizio del video. Lascia vuoto per riprodurre fino alla fine. Un tempo di fine nell'URL del video (es. &end=120) sostituisce questa opzione per ogni video."

PLG_FIELDS_YOUTUBE_FREE_VERSION = "Questa è la versione GRATUITA del plugin Joomill Custom Fields. <br/> Alcune funzionalità e supporto sono disponibili solo nella versione PRO."
PLG_FIELDS_YOUTUBE_UPGRADE_DESC = "<div class=\"alert alert-success\">Stai usando la versione GRATUITA del plugin Joomill Custom Fields. Alcune funzionalità e il supporto sono disponibili solo nella <a href=\"https://www.joomill-extensions.com/extensions/custom-fields-plugins\" target=\"_blank\" rel=\"noopener\">versione PRO</a>.</div>"

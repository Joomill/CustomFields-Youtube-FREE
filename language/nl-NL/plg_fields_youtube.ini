PLG_FIELDS_YOUTUBE_PARAMS_END_LABEL = "Eindtijd (seconden)"
PLG_FIELDS_YOUTUBE_PARAMS_END_DESC = "Stop het afspelen na dit aantal seconden vanaf het begin van de video. Laat leeg om tot het einde af te spelen. Een eindtijd in de video-URL (bijv. &end=120) overschrijft deze optie per video."


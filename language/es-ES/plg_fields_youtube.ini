PLG_FIELDS_YOUTUBE = "Campos - Youtube"
PLG_FIELDS_YOUTUBE_XML_DESCRIPTION = "Este plugin te permite crear nuevos campos para 'videos de Youtube' en cualquier extensión donde se soporten campos personalizados."
PLG_FIELDS_YOUTUBE_LABEL = "Youtube (%s)"
PLG_FIELDS_YOUTUBE_PRO_ONLY = "Disponible solo en la versión PRO"

PLG_FIELDS_YOUTUBE_PARAMS_VIDEO_WIDTH_LABEL = "Ancho"
PLG_FIELDS_YOUTUBE_PARAMS_VIDEO_WIDTH_DESC = "Este parámetro especifica el ancho del video. Puedes usar % o px."
PLG_FIELDS_YOUTUBE_PARAMS_VIDEO_HEIGHT_LABEL = "Altura"
PLG_FIELDS_YOUTUBE_PARAMS_VIDEO_HEIGHT_DESC = "Este parámetro especifica la altura del video. Puedes usar % o px."
PLG_FIELDS_YOUTUBE_PARAMS_AUTOPLAY_LABEL = "Autorreproducción"
PLG_FIELDS_YOUTUBE_PARAMS_AUTOPLAY_DESC = "Este parámetro especifica si el video comenzará a reproducirse automáticamente cuando se cargue el reproductor."
PLG_FIELDS_YOUTUBE_PARAMS_CONTROLS_LABEL = "Mostrar Controles"
PLG_FIELDS_YOUTUBE_PARAMS_CONTROLS_DESC = "Este parámetro indica si los controles del reproductor de video se muestran."
PLG_FIELDS_YOUTUBE_PARAMS_COLOR_LABEL = "Color"
PLG_FIELDS_YOUTUBE_PARAMS_COLOR_DESC = "Este parámetro especifica el color que se usará en la barra de progreso del reproductor para resaltar la cantidad de video que el espectador ya ha visto."
PLG_FIELDS_YOUTUBE_PARAMS_COLOR_WHITE = "Blanco"
PLG_FIELDS_YOUTUBE_PARAMS_COLOR_RED = "Rojo"
PLG_FIELDS_YOUTUBE_PARAMS_MODESTBRANDING_LABEL = "Marca Discreta"
PLG_FIELDS_YOUTUBE_PARAMS_MODESTBRANDING_DESC = "Este parámetro te permite usar un reproductor de YouTube que no muestre el logotipo de YouTube. Configura el valor del parámetro en SÍ para evitar que el logotipo de YouTube se muestre en la barra de control. Ten en cuenta que aparecerá una pequeña etiqueta de texto de YouTube en la esquina superior derecha de un video pausado cuando el puntero del ratón del usuario pase sobre el reproductor."
PLG_FIELDS_YOUTUBE_PARAMS_FULLSCREEN_LABEL = "Permitir Pantalla Completa"
PLG_FIELDS_YOUTUBE_PARAMS_FULLSCREEN_DESC = "Configurar este parámetro en NO evita que el botón de pantalla completa se muestre en el reproductor."
PLG_FIELDS_YOUTUBE_PARAMS_REL_LABEL = "Mostrar Videos Relacionados"
PLG_FIELDS_YOUTUBE_PARAMS_REL_DESC = "Este parámetro indica si el reproductor debe mostrar videos relacionados cuando finalice la reproducción del video inicial."

; desde la versión 1.1.0
PLG_FIELDS_YOUTUBE_PARAMS_ALIGN_LABEL = "Alinear"
PLG_FIELDS_YOUTUBE_PARAMS_ALIGN_DESC = "Este parámetro especifica cómo deseas alinear la presentación. Elige entre Izquierda o Centro."
PLG_FIELDS_YOUTUBE_PARAMS_ALIGN_LEFT = "Izquierda"
PLG_FIELDS_YOUTUBE_PARAMS_ALIGN_CENTER = "Centro"
PLG_FIELDS_YOUTUBE_PARAMS_ALIGN_RIGHT = "Derecha"
PLG_FIELDS_YOUTUBE_PARAMS_MODE_LABEL = "Modo"
PLG_FIELDS_YOUTUBE_PARAMS_MODE_DESC = "Elige el modo del reproductor. El modo Clásico te permitirá configurar el ancho, la altura y la alineación. El modo Responsivo siempre tendrá un ancho del 100% y te permitirá elegir la relación de aspecto."
PLG_FIELDS_YOUTUBE_PARAMS_MODE_CLASSIC = "Modo Clásico"
PLG_FIELDS_YOUTUBE_PARAMS_MODE_RESPONSIVE = "Modo Responsivo"
PLG_FIELDS_YOUTUBE_PARAMS_ASPECTRATIO_LABEL = "Relación de Aspecto"
PLG_FIELDS_YOUTUBE_PARAMS_ASPECTRATIO_DESC = "Elige la Relación de Aspecto. Puedes elegir entre 16:9 y 4:3."

; desde la versión 5.2.0
PLG_FIELDS_YOUTUBE_PLAY = "Reproducir vídeo"
PLG_FIELDS_YOUTUBE_PARAMS_NOCOOKIE_LABEL = "Modo de privacidad mejorada (sin cookies)"
PLG_FIELDS_YOUTUBE_PARAMS_NOCOOKIE_DESC = "Cuando está activado, el vídeo se incrusta a través de youtube-nocookie.com para que YouTube no almacene cookies ni información de seguimiento hasta que el visitante reproduzca el vídeo. Recomendado para el cumplimiento del RGPD."
PLG_FIELDS_YOUTUBE_PARAMS_LITE_LABEL = "Clic para reproducir (carga diferida)"
PLG_FIELDS_YOUTUBE_PARAMS_LITE_DESC = "Cuando está activado, solo se muestra una miniatura con un botón de reproducción. El reproductor de YouTube se carga, y se contacta con YouTube, solo después de que el visitante hace clic. La mejor opción para la privacidad y la velocidad de la página."
PLG_FIELDS_YOUTUBE_PARAMS_MUTE_LABEL = "Silenciar"
PLG_FIELDS_YOUTUBE_PARAMS_MUTE_DESC = "Cuando está activado, el vídeo comienza silenciado. La mayoría de los navegadores lo requieren para que funcione la reproducción automática."
PLG_FIELDS_YOUTUBE_PARAMS_CAPTIONS_LABEL = "Mostrar Subtítulos"
PLG_FIELDS_YOUTUBE_PARAMS_CAPTIONS_DESC = "Cuando está activado, los subtítulos se muestran de forma predeterminada, incluso si el espectador los ha desactivado."
PLG_FIELDS_YOUTUBE_PARAMS_PLAYSINLINE_LABEL = "Reproducir en línea (móvil)"
PLG_FIELDS_YOUTUBE_PARAMS_PLAYSINLINE_DESC = "Cuando está activado, el vídeo se reproduce en línea en el iPhone en lugar de pasar automáticamente a pantalla completa."
PLG_FIELDS_YOUTUBE_PARAMS_LOOP_LABEL = "Bucle"
PLG_FIELDS_YOUTUBE_PARAMS_LOOP_DESC = "Cuando está activado, el vídeo se reproduce de nuevo desde el principio una vez que termina."
PLG_FIELDS_YOUTUBE_PARAMS_START_LABEL = "Tiempo de inicio (segundos)"
PLG_FIELDS_YOUTUBE_PARAMS_START_DESC = "Inicia la reproducción en este número de segundos desde el principio del vídeo. Déjalo vacío para empezar desde el principio."
PLG_FIELDS_YOUTUBE_PARAMS_END_LABEL = "Tiempo de fin (segundos)"
PLG_FIELDS_YOUTUBE_PARAMS_END_DESC = "Detiene la reproducción en este número de segundos desde el principio del vídeo. Déjalo vacío para reproducir hasta el final."

PLG_FIELDS_YOUTUBE_FREE_VERSION = "Esta es la versión GRATUITA del plugin Joomill Custom Fields. <br/> Algunas funciones y el soporte solo están disponibles en la versión PRO."
